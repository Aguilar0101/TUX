[package]
name = "the-tuxs"
version = "3.8.0"
description = "Gestión Escolar Inteligente - The Tux's"
authors = ["aguilar"]
edition = "2021"

[lib]
name = "the_tuxs"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rand = "0.8"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.4"
tiny_http = "0.12"  # <-- Añade esta línea para levantar el servidor local en la red Wi-Fi / Hotspot
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.3"
